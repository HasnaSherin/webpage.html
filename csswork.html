<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <STYle>
    .main{
      margin:0;
      padding: 0;
      box-sizing: border-box;
      /* background-color: white; */
     
    }
    body{
      margin: 0;
      padding: 0;
    }
    .head{
      display: flex;
      align-items: center;
      color: white;
      background-color:  rgba(1, 9, 26, 0.788);
      padding-left: 180px;
      gap: 5px;
      /* justify-content: space-between; */
      width: 100%;
      height: 55px;
      box-sizing: border-box;
      
    }
    .head p{
      font-weight: bold;
      margin: 0;
    }
    .head b{
      padding-left: 50px;
    }
    .right{
      padding-left: 300px;
      
    }
    h2{
      align-items: center;
    }
    .image{
      position: relative;
      width: 100%;
      
    }
    .image img{
      width: 100%;
      height: auto;
      display: block;
    }


    nav  {
      background-color: rgba(255,255,255,0.75);
      /* background-color: white; */
      font-size: 20px;
      color: rgb(3, 3, 52);
      display: flex;
      align-items: center;
      /* justify-content: space-between; */
      gap: 30px;
     padding-left: 300px;
     z-index: 100;
     /* opacity: 0.5; */
     box-sizing: border-box;
     width: 100%;
    

      }
      
      .sticky-box {
      position: absolute;
      top: 55px;
      left: 0;
      width: 100%;
      z-index: 100;
      }
      
    p{
      align-items: center;
    }
    button{
      border-radius: 20px;
      size: 20px;
      border-color: rgb(5, 2, 19);
      height: 35px;
      width:99px;
      color: rgb(2, 2, 8);
      font-weight: bold;
      margin-left: auto;
      margin-right: 250px;
    }
    .middle{
            position: absolute;
           top: 250px;
           left: 20%;
           width: 490px;
           z-index: 2;
        }
        .middle strong{
            font-size: 55px;

        }
        .middle p{
            width: 470px;
            font-size: 22px;
            margin-left:7px;
          font-family:  Helvetica;
            
        }
    .buttons{
     
      display: flex;
      gap: 20px;
      margin-left: 9px;
      font-size: large;
      font-weight: bold;
    }
    .button1{
      height: 40px;
      background-color: rgb(20, 2, 89);
      color: white;
      width: 180px;
      /* border: none; */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .button2{
      height: 40px;
      background-color: rgba(226, 215, 5, 0.912);
      color: rgb(5, 6, 63);
      width: 180px;
      /* border: none; */
      display: flex;
      align-items: center;
      justify-content: center;
      
    }
    
    
  </STYle>
</head>
<body>
  <div class="main">
    <div class="head">
      <p>1010 Avenue, New York,NY 10018 US.</p>
      <b>212 386 5575,212 386 5576</b>
      <div class="right">
        <b>Mon-Sat, 8.00-18.00.Sunday CLOSED</b>
      </div>
      
    </div>
    
      <div class="sticky-box">
    <nav>
      <h2>Elixir</h2>
      <p>Home</p>
      <p>Pages</p>
      <p>News</p>
      <p>Elements</p>
      <p>Contact</p>
      <p>Docs</p>
      <button >Purchase</button>
      </nav>
      </div>
      <div class="image">
    
        <img src="growthpartner.jpeg" alt="">
        <div class="middle">
        <strong>Growth Partners</strong>
        <br>
        <p>Connect with top consultants hand-picked by Elixir consulting and finance.</p><br><br>
        <div class="buttons">
          <div class="button1">Read More</div>
          <div class="button2">Contact us</div>

        </div>
        
      </div>
      </div>
      
  </div>
</body>
</html>
